[package]
name = "bosun-editor"
version = "0.8.2"
edition = "2021"
description = "Desktop and Android editor for PaintAudio MIDI Captain controllers running Bosun firmware, with Kemper Player, Kemper PROFILER and generic MIDI profiles."
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2.7.0", default-features = false, features = [] }

[dependencies]
tauri = { version = "2.12.0", default-features = false, features = ["wry", "custom-protocol"] }
# Persist and restore the main window size/position across launches.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }
base64 = "0.22"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Platform-specific serial and MIDI dependencies.
# Desktop: serial2 for CDC serial and serialport for USB VID/PID enumeration.
# Android: the Kotlin BosunSerialBridge and BosunMidiBridge own the USB
# devices and Rust reaches them over JNI. No firmware installer on mobile.

[target.'cfg(not(target_os = "android"))'.dependencies]
serial2 = "0.2"
serialport = { version = "4", default-features = false }
nusb = "0.2.7"
# Native file dialog used by export.rs for folder picker. Desktop-only.
rfd = "0.15"
# USB-MIDI relay between the Kemper (Player) and the pedal. Uses winmm
# on Windows, CoreMIDI on macOS, ALSA on Linux. Desktop-only.
midir = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
# Keep the embedded frontend brotli-compressed on Android, as before (it used
# to come with a plugin's default tauri features): the APK stores each ABI's
# library uncompressed, so this keeps the download small.
tauri = { version = "2.12.0", default-features = false, features = ["compression"] }
# JNI bridge to the Kotlin BosunSerialBridge and BosunMidiBridge singletons.
# Version matches the jni crate wry/tauri use so the types unify.
jni = "0.21"
# Default export folder (export.rs): Android has no native folder picker.
dirs = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Power"] }

[lib]
name = "bosun_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
