[package]
name = "bosun-editor"
version = "0.7.1"
edition = "2021"
description = "Desktop editor for PaintAudio MIDI Captain controllers running Bosun firmware, with a plugin system for any MIDI target device (Kemper Player, Hotone Ampero II Stage, Line 6 Helix, generic MIDI, and more)."
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", default-features = false, features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "custom-protocol"] }
tauri-plugin-shell = "2"
# Persist and restore the main window size/position across launches.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }
base64 = "0.22"
sha2 = "0.10"
dirs = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Platform-specific serial and MIDI dependencies.
# Desktop: serial2 for CDC serial and serialport for USB VID/PID enumeration.
# Android: tauri-plugin-serialplugin v3 (pure Rust, uses nusb +
# android-usb-serial, supports CDC-ACM). No firmware installer on mobile.

[target.'cfg(not(target_os = "android"))'.dependencies]
serial2 = "0.2"
serialport = { version = "4", default-features = false }
nusb = "0.2.7"
# Native file dialog used by export.rs for folder picker. Desktop-only.
rfd = "0.15"
# USB-MIDI relay between the Kemper (Player) and the pedal. Uses winmm
# on Windows, CoreMIDI on macOS, ALSA on Linux. Desktop-only.
midir = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-serialplugin = "3"
# JNI bridge to the Kotlin BosunMidiBridge singleton (Android MIDI relay).
# Version matches the jni crate wry/tauri use so the types unify.
jni = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Power"] }

[lib]
name = "bosun_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Official reproducible-build fix: https://github.com/tauri-apps/tauri/pull/15777
# Pin codegen and utils to the same Tauri 2 commit; published codegen 2.6.3
# does not include this fix. Keep the pin until a compatible stable release
# passes the reproducibility checks in docs/android-reproducible-builds.md.
[patch.crates-io]
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", rev = "29c87c3d3f5bbcf5a7ae9de01af7e6bb738c1d01" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "29c87c3d3f5bbcf5a7ae9de01af7e6bb738c1d01" }
