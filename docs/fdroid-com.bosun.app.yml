# Draft F-Droid build metadata for Bosun's Android app.
#
# This is NOT submitted anywhere yet. F-Droid inclusion works like this:
#   1. Fork https://gitlab.com/fdroid/fdroiddata
#   2. Add this file (renamed to just the package ID: metadata/com.bosun.app.yml)
#      to that fork's metadata/ directory
#   3. Open a merge request against fdroiddata
#   4. F-Droid's build server (Linux, sandboxed, no network access beyond
#      what's declared) attempts an actual build using this recipe and
#      reports back pass/fail
#   5. A human F-Droid maintainer reviews the MR (license, anti-features,
#      reproducibility) - this can take from days to several weeks, and
#      commonly involves iterating on the build recipe based on real
#      build-server failures
#
# None of steps 1-5 can be done by an AI assistant - they need a GitLab
# account and ongoing engagement with the F-Droid community. This file is
# a starting point for that submission, not a finished one.
#
# PRIOR ATTEMPT (2026-07-24, MR !43795, still open, found 2026-08-16 while
# starting this session's submission - almost duplicated it blind): dropped
# Builds: entirely in favor of Binaries:-only verification ("Tauri/Rust
# build not supported in F-Droid env"), which schema-validates as invalid -
# 'Builds' is a required property even alongside Binaries: (that's what
# Binaries: verifies AGAINST - F-Droid still builds from source and diffs
# the result). Also had License: MIT (stale - the repo declared
# GPL-3.0-or-later this session) and a non-templated Binaries: URL
# (schema requires a %v or %c placeholder so future releases resolve
# automatically, not a URL hardcoded to v0.5.0). This draft restores a
# real Builds: entry (below) and fixes both of those, keeping the same
# AllowedAPKSigningKeys - independently re-derived this session from a
# fresh v0.6.0 release APK via `apksigner verify --print-certs` and it's
# identical, confirming the signing key itself hasn't changed across
# releases (only a CI build-tools/tag_name bug briefly broke publishing
# a properly signed artifact - fixed separately in the main repo).
#
# TESTED LOCALLY (2026-08-16) against a real fdroidserver + F-Droid
# buildserver image (registry.gitlab.com/fdroid/fdroidserver:buildserver,
# which is the actual Debian 13 environment F-Droid's CI builds on -
# fdroidserver itself pip-installed on top, since the image doesn't ship
# it). `fdroid lint com.bosun.app` passes clean. `fdroid build -t`
# (local/non-server test mode) found and fixed three real bugs:
#   - init: used an invented $$bosun-midi-captain$$ placeholder for "repo
#     root" - not real F-Droid syntax (only $$SDK$$/$$NDK$$/$$VERSION$$
#     are), and since init commands run through bash -c, bash's own $$
#     (process ID) mangled every path. Rewritten with relative paths.
#   - The buildserver image's ndk/ directory ships EMPTY - added the
#     `ndk:` field so F-Droid actually provisions $$NDK$$ before init:
#     runs, instead of assuming it's already there.
#   - cargo had no linker configured for aarch64-linux-android (same
#     requirement build-android.ps1 sets locally via
#     CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER) - added the export.
#
# RESOLVED VIA REAL PIPELINE RUNS (2026-08-16, MR !43795, iterating
# against the actual F-Droid buildserver - not local test mode, which
# skips `sudo:` entirely and couldn't have caught any of these):
#   - crates.io network access during the build: WORKS. Pipeline
#     #2763743410 resolved and downloaded every one of Bosun's ~150
#     transitive crate dependencies successfully before hitting the
#     (unrelated, now-fixed) missing-C-compiler error below. No
#     vendoring needed.
#   - node/npm install, rustup install, and the npm/vite frontend build
#     all work as-is once the ndk:/PATH/HOME issues above were fixed.
#   - The documented Tauri-vs-F-Droid gradlew-stripping incompatibility
#     (tauri-apps/tauri#6367) has NOT bitten this recipe, because it never
#     calls `tauri android build` in the first place - cargo and gradlew
#     are invoked directly (see init:/gradle: below), same as
#     build-android.ps1 does locally. Confirmed by getting past the whole
#     Rust build step without hitting it.
#
# STILL UNVERIFIED: whether `gradle:` (gradlew assembleRelease) itself
# succeeds once cargo actually produces the .so - not yet reached by any
# pipeline run as of the build-essential fix below.

Categories:
  - Multimedia
License: GPL-3.0-or-later
AuthorName: Danilo Migliarino
SourceCode: https://github.com/danmigdev/bosun-midi-captain
IssueTracker: https://github.com/danmigdev/bosun-midi-captain/issues

AutoName: Bosun
Summary: Editor and Stage view for PaintAudio MIDI Captain foot controllers
Description: |
    Bosun is an editor and live "Stage" companion for the PaintAudio MIDI
    Captain foot controller running Bosun firmware. Configure switches,
    bindings and screen layout, and mirror the pedal's live state on a
    phone or tablet at a gig - connects directly over USB-OTG, no computer
    needed. Plugin system supports Kemper Player, Hotone Ampero II Stage,
    Line 6 Helix, and generic MIDI devices.

RepoType: git
Repo: https://github.com/danmigdev/bosun-midi-captain

# %v is required by F-Droid's schema (a bare hardcoded version in the old
# draft's URL failed schema validation) - it's substituted with each new
# release's version as CurrentVersion advances, so this doesn't need
# manual updates going forward. F-Droid builds from source per Builds:
# below and diffs the result against whatever this resolves to, as the
# reproducibility check.
Binaries: https://github.com/danmigdev/bosun-midi-captain/releases/download/v%v/bosun.apk

# SHA-256 of the release signing certificate - re-derived 2026-08-16 from
# a fresh v0.6.0 APK via `apksigner verify --print-certs`, matches the
# prior MR's value exactly (same signing key across all releases).
AllowedAPKSigningKeys: 53fd21db1e975195c7f6faf45f9c3f3a3fdcb310738762a61397be175e136e93

Builds:
  - versionName: 0.6.0
    versionCode: 29
    commit: v0.6.0
    subdir: editor/src-tauri/gen/android
    # Provisions $$NDK$$ (and sets ANDROID_NDK/ANDROID_NDK_HOME) before
    # init: runs - matches the version build-android.ps1 pins locally
    # (editor/src-tauri, $ndkBin). Found via a local test (2026-08-16):
    # the buildserver image's ndk/ directory ships EMPTY - this field is
    # what actually provisions it, not something baked into the image.
    # 30.0.15729638 (what build-android.ps1 uses locally on Windows) isn't
    # available in F-Droid's NDK repo - confirmed live 2026-08-16, pipeline
    # #2763718402: "Failed to find package 'ndk;30.0.15729638' - Did you
    # mean 'ndk;30.0.14904198'?" - same NDK release line, different exact
    # build. Using what F-Droid actually has.
    ndk: "30.0.14904198"
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm build-essential
      # build-essential (gcc/cc): Rust's build scripts and proc-macros
      # (proc-macro2, quote, serde_core, ...) compile for the HOST, not
      # the aarch64-linux-android target, and need a native C toolchain
      # regardless of cross-compilation - confirmed live 2026-08-16,
      # pipeline #2763743410: cargo resolved and downloaded every crate
      # successfully (confirms crates.io network access works fine on
      # F-Droid's infra) and started compiling before hitting
      # "error: linker `cc` not found - No such file or directory".
      #
      # `sudo:` lines run via a bare `sudo bash -c "...; ...; ..."` with
      # NO --user, so this whole block runs as ROOT, not vagrant -
      # rustup-init installs to $HOME/.cargo, and here $HOME is /root.
      # But the LATER `init:` block runs as vagrant (HOME=/home/vagrant -
      # confirmed via the fdroid build wrapper's own env), a completely
      # different context, so cargo installed under /root/.cargo is
      # invisible to it regardless of PATH. Confirmed live 2026-08-16,
      # pipeline #2763738704: rustup installed fine, `rustup target add`
      # (fixed to reference $HOME/.cargo/bin explicitly) also succeeded,
      # but init:'s `cargo build` still hit "command not found" - because
      # the two blocks' $HOME point at different directories entirely,
      # not because of a PATH-vs-no-PATH issue like the previous fix.
      # Explicitly install under vagrant's home (root can still write
      # there - it's root) so the file ownership and location both match
      # what init: expects.
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | HOME=/home/vagrant sh -s -- -y
      - chown -R vagrant:vagrant /home/vagrant/.cargo /home/vagrant/.rustup
      - HOME=/home/vagrant /home/vagrant/.cargo/bin/rustup target add aarch64-linux-android
    init:
      # Frontend build + Rust cross-compile happen here since F-Droid's
      # standard `gradle:` build type only drives the Gradle half - see
      # build-android.ps1 for the equivalent Windows/local version of
      # this same three-step sequence. Paths are relative, walking up
      # from `subdir` (editor/src-tauri/gen/android) - NOT the $$VAR$$
      # syntax, which is reserved for F-Droid's own substitutions
      # ($$SDK$$/$$NDK$$/$$VERSION$$); an earlier draft invented
      # $$bosun-midi-captain$$ for "repo root", which isn't a real
      # F-Droid feature and got mangled by bash's own $$ (PID) variable
      # instead (confirmed via a local `fdroid build -t` test,
      # 2026-08-16 - see that test's other finding below: `sudo:` steps
      # don't run in local/non-server mode, so the Rust toolchain/NDK
      # question this recipe exists to answer is still unverified past
      # this point without manually pre-installing them in the test
      # environment). All four lines run as ONE joined shell (cwd
      # carries over), so each cd is relative to wherever the previous
      # line left off. CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER matches
      # what build-android.ps1 sets for the same cross-compile locally
      # (there, $$NDK$$ is the Windows NDK dir + ...\windows-x86_64\bin\
      # ...21-clang.cmd; here it's the Linux NDK's linux-x86_64 toolchain,
      # no .cmd extension) - without it cargo has no linker for the
      # aarch64-linux-android target and the build fails at link time.
      # PATH: this init: block is its own separate shell context from the
      # sudo: block above - cargo/rustc, installed to $HOME/.cargo/bin by
      # rustup, need the same explicit-path treatment applied to rustup
      # itself above, or this will hit the identical "command not found".
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
      - cd ../../.. && npm ci && npm run build
      - cd src-tauri && cargo build --release --target aarch64-linux-android && cd ..
      - mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
      - cp src-tauri/target/aarch64-linux-android/release/libbosun_editor_lib.so src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/
    gradle:
      - yes
    output: app/build/outputs/apk/arm64/release/app-arm64-release-unsigned.apk

