# the tracked android-version-code.txt counter and is declared per
# release directly in this file's own versionCode: field above. Fixed by
# switching to Static (confirmed via fdroidserver's own checkupdates.py
# source: 'None'/'Static' both just `return` early with no version-
# information exception, which is exactly correct here - there is
# nothing for auto-checkupdates to discover from source, by design).
