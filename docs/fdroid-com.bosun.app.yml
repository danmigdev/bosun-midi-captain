IssueTracker: https://github.com/danmigdev/bosun-midi-captain/issues

# RESOLVED (2026-08-16, pipeline for commit c4eddb09): fdroidserver's own
# `tools/make-summary-translatable.py` (a fdroiddata repo-maintenance
# script, part of the "tools check scripts" CI job) requires Summary: to
# live in a separate metadata/com.bosun.app/en-US/summary.txt file, not
# inline here - it treats any inline Summary: as something to migrate,
# and exits non-zero (reporting a count of files it "fixed") whenever it
# finds one, which CI reads as a failure. Ran it locally (pip install
# fdroidserver) against this exact file to get its precise expected
# transformation rather than guessing - it strips this line and writes
# the same text to en-US/summary.txt (pushed alongside this file).
AutoName: Bosun
Description: |
    Bosun is an editor and live "Stage" companion for the PaintAudio MIDI
    Captain foot controller running Bosun firmware. Configure switches,
    bindings and screen layout, and mirror the pedal's live state on a
    phone or tablet at a gig - connects directly over USB-OTG, no computer
    needed. Plugin system supports Kemper Player, Hotone Ampero II Stage,
    Line 6 Helix, and generic MIDI devices.

RepoType: git
Repo: https://github.com/danmigdev/bosun-midi-captain

# %v is required by F-Droid's schema (a bare hardcoded version in the old
# draft's URL failed schema validation) - it's substituted with each new
# release's version as CurrentVersion advances, so this doesn't need
# manual updates going forward. F-Droid builds from source per Builds:
# below and diffs the result against whatever this resolves to, as the
# reproducibility check.
Binaries: https://github.com/danmigdev/bosun-midi-captain/releases/download/v%v/bosun.apk

# SHA-256 of the release signing certificate - re-derived 2026-08-16 from
# a fresh v0.6.0 APK via `apksigner verify --print-certs`, matches the
# prior MR's value exactly (same signing key across all releases).
AllowedAPKSigningKeys: 53fd21db1e975195c7f6faf45f9c3f3a3fdcb310738762a61397be175e136e93

Builds:
  - versionName: 0.6.0
    versionCode: 29
    commit: v0.6.0
    subdir: editor/src-tauri/gen/android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm build-essential
      # build-essential (gcc/cc): Rust's build scripts and proc-macros
      # (proc-macro2, quote, serde_core, ...) compile for the HOST, not
      # the aarch64-linux-android target, and need a native C toolchain
      # regardless of cross-compilation - confirmed live 2026-08-16,
      # pipeline #2763743410: cargo resolved and downloaded every crate
      # successfully (confirms crates.io network access works fine on
      # F-Droid's infra) and started compiling before hitting
      # "error: linker `cc` not found - No such file or directory".
      #
      # `sudo:` lines run via a bare `sudo bash -c "...; ...; ..."` with
      # NO --user, so this whole block runs as ROOT, not vagrant -
      # rustup-init installs to $HOME/.cargo, and here $HOME is /root.
      # But the LATER `init:` block runs as vagrant (HOME=/home/vagrant -
      # confirmed via the fdroid build wrapper's own env), a completely
      # different context, so cargo installed under /root/.cargo is
      # invisible to it regardless of PATH. Confirmed live 2026-08-16,
      # pipeline #2763738704: rustup installed fine, `rustup target add`
      # (fixed to reference $HOME/.cargo/bin explicitly) also succeeded,
      # but init:'s `cargo build` still hit "command not found" - because
      # the two blocks' $HOME point at different directories entirely,
      # not because of a PATH-vs-no-PATH issue like the previous fix.
      # Explicitly install under vagrant's home (root can still write
      # there - it's root) so the file ownership and location both match
      # what init: expects.
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | HOME=/home/vagrant sh -s -- -y
      - chown -R vagrant:vagrant /home/vagrant/.cargo /home/vagrant/.rustup
      # All four targets, not just aarch64 - see the RESOLVED note below
      # (pipeline for commit 4bcb38d3): the GitHub release bosun.apk that
      # Binaries: verifies against is a UNIVERSAL (all-ABI) APK, built via
      # the real `tauri android build` in release.yml, which cross-compiles
      # for all four of these targets (release.yml's own "Rust toolchain
      # with Android targets" step lists the identical four). Matching
      # that is required for the reproducibility diff to pass, not optional.
      - HOME=/home/vagrant /home/vagrant/.cargo/bin/rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    init:
      # Frontend build + Rust cross-compile happen here since F-Droid's
      # standard `gradle:` build type only drives the Gradle half - see
      # build-android.ps1 for the equivalent Windows/local version of
      # this same three-step sequence. Paths are relative, walking up
      # from `subdir` (editor/src-tauri/gen/android) - NOT the $$VAR$$
      # syntax, which is reserved for F-Droid's own substitutions
      # ($$SDK$$/$$NDK$$/$$VERSION$$); an earlier draft invented
      # $$bosun-midi-captain$$ for "repo root", which isn't a real
      # F-Droid feature and got mangled by bash's own $$ (PID) variable
      # instead (confirmed via a local `fdroid build -t` test,
      # 2026-08-16 - see that test's other finding below: `sudo:` steps
      # don't run in local/non-server mode, so the Rust toolchain/NDK
      # question this recipe exists to answer is still unverified past
      # this point without manually pre-installing them in the test
      # environment). All four lines run as ONE joined shell (cwd
      # carries over), so each cd is relative to wherever the previous
      # line left off. CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER matches
      # what build-android.ps1 sets for the same cross-compile locally
      # (there, $$NDK$$ is the Windows NDK dir + ...\windows-x86_64\bin\
      # ...21-clang.cmd; here it's the Linux NDK's linux-x86_64 toolchain,
      # no .cmd extension) - without it cargo has no linker for the
      # aarch64-linux-android target and the build fails at link time.
      # PATH: this init: block is its own separate shell context from the
      # sudo: block above - cargo/rustc, installed to $HOME/.cargo/bin by
      # rustup, need the same explicit-path treatment applied to rustup
      # itself above, or this will hit the identical "command not found".
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
      # Same NDK clang-wrapper convention as the aarch64 linker above, one
      # per additional target needed for the universal APK (see sudo: and
      # the RESOLVED note near output: below). Note the armv7 wrapper is
      # named armv7a (with the trailing "a"), NOT armv7 - that's the NDK's
      # own naming, distinct from the armv7-linux-androideabi Rust target
      # triple/CARGO_TARGET_* var name.
      - export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
      - export CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang
      - export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang
      # Makes tauri-build's build.rs (invoked from bosun-editor's own
      # build.rs during the cargo build below) write gen/android/
      # tauri.settings.gradle, app/tauri.build.gradle.kts, and
      # app/proguard-tauri.pro - all three gitignored/generated, all three
      # `apply`'d or referenced by the committed build.gradle.kts files,
      # and NONE of them exist in a bare clone since this recipe never
      # runs the actual Tauri CLI (see pipeline #2763765662 finding
      # above). PACKAGE_UNESCAPED must be set explicitly - the alternative
      # env var it'd otherwise fall back to is never set in this recipe
      # and panics the cargo build if reached (see above).
      - export TAURI_ANDROID_PROJECT_PATH="$(pwd)"
      - export TAURI_ANDROID_PACKAGE_UNESCAPED="com.bosun.app"
      # tauri's AND wry's build.rs (both cached locally, both checked) each
      # have their own Kotlin-codegen block gated behind these same three
      # vars - tauri's writes TauriActivity.kt, wry's writes WryActivity.kt/
      # RustWebView.kt/Rust.kt/etc - into app/src/main/**/generated (itself
      # gitignored, confirmed via app/.gitignore: `/src/main/**/generated`).
      # Unset, both blocks are silently skipped and MainActivity.kt (which
      # `class MainActivity : TauriActivity()`s) fails to compile with
      # "Unresolved reference: TauriActivity" (see finding above, pipeline
      # #2763792622/rerun). kotlin_out_dir is canonicalize()'d by both
      # build.rs files, which requires the directory to already exist -
      # hence the mkdir. WRY_ANDROID_LIBRARY matches Cargo.toml's [lib]
      # name (confirmed against the local generated Rust.kt's
      # System.loadLibrary("bosun_editor_lib") call).
      - mkdir -p app/src/main/java/com/bosun/app/generated
      - export WRY_ANDROID_KOTLIN_FILES_OUT_DIR="$(pwd)/app/src/main/java/com/bosun/app/generated"
      - export WRY_ANDROID_PACKAGE="com.bosun.app"
      - export WRY_ANDROID_LIBRARY="bosun_editor_lib"
      # editor/src-tauri/resources/{firmware,lib} are gitignored (hand-
      # synced from firmware/ locally, or provisioned as a CI step -
      # release.yml's "Provision bundled firmware resources"). Tauri's own
      # build.rs needs at least the directories to exist even if resources/
      # lib stays empty (that's all release.yml itself does - the fuller
      # firmware/lib/ sync is a LOCAL packaging step, not part of the
      # release artifact). Confirmed live 2026-08-16, pipeline #2763746808:
      # got all the way to compiling bosun-editor itself before failing
      # with "resource path 'resources/lib' doesn't exist" - every one of
      # its ~150 dependencies built fine first.
      - cd ../../../.. && mkdir -p editor/src-tauri/resources/firmware editor/src-tauri/resources/lib && cp -r firmware editor/src-tauri/resources/firmware && find editor/src-tauri/resources/firmware -name __pycache__ -type d -prune -exec rm -rf {} + 2>/dev/null; curl -fL -o editor/src-tauri/resources/circuitpython.uf2 https://downloads.circuitpython.org/bin/raspberry_pi_pico/en_US/adafruit-circuitpython-raspberry_pi_pico-en_US-9.2.7.uf2
      - cd editor && npm ci && npm run build
      # Building all four targets in one cargo invocation (multiple
      # --target flags, each gets its own target/<triple>/release/ dir) -
      # required for the universal APK reproducibility match, see the
      # RESOLVED note near output: below.
      - cd src-tauri && cargo build --release --target aarch64-linux-android --target armv7-linux-androideabi --target i686-linux-android --target x86_64-linux-android && cd ..
      - mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a src-tauri/gen/android/app/src/main/jniLibs/armeabi-v7a src-tauri/gen/android/app/src/main/jniLibs/x86 src-tauri/gen/android/app/src/main/jniLibs/x86_64
      - cp src-tauri/target/aarch64-linux-android/release/libbosun_editor_lib.so src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/
