# Draft F-Droid build metadata for Bosun's Android app.
#
# This is NOT submitted anywhere yet. F-Droid inclusion works like this:
#   1. Fork https://gitlab.com/fdroid/fdroiddata
#   2. Add this file (renamed to just the package ID: metadata/com.bosun.app.yml)
#      to that fork's metadata/ directory
#   3. Open a merge request against fdroiddata
#   4. F-Droid's build server (Linux, sandboxed, no network access beyond
#      what's declared) attempts an actual build using this recipe and
#      reports back pass/fail
#   5. A human F-Droid maintainer reviews the MR (license, anti-features,
#      reproducibility) - this can take from days to several weeks, and
#      commonly involves iterating on the build recipe based on real
#      build-server failures
#
# None of steps 1-5 can be done by an AI assistant - they need a GitLab
# account and ongoing engagement with the F-Droid community. This file is
# a starting point for that submission, not a finished one.
#
# PRIOR ATTEMPT (2026-07-24, MR !43795, still open, found 2026-08-16 while
# starting this session's submission - almost duplicated it blind): dropped
# Builds: entirely in favor of Binaries:-only verification ("Tauri/Rust
# build not supported in F-Droid env"), which schema-validates as invalid -
# 'Builds' is a required property even alongside Binaries: (that's what
# Binaries: verifies AGAINST - F-Droid still builds from source and diffs
# the result). Also had License: MIT (stale - the repo declared
# GPL-3.0-or-later this session) and a non-templated Binaries: URL
# (schema requires a %v or %c placeholder so future releases resolve
# automatically, not a URL hardcoded to v0.5.0). This draft restores a
# real Builds: entry (below) and fixes both of those, keeping the same
# AllowedAPKSigningKeys - independently re-derived this session from a
# fresh v0.6.0 release APK via `apksigner verify --print-certs` and it's
# identical, confirming the signing key itself hasn't changed across
# releases (only a CI build-tools/tag_name bug briefly broke publishing
# a properly signed artifact - fixed separately in the main repo).
#
# TESTED LOCALLY (2026-08-16) against a real fdroidserver + F-Droid
# buildserver image (registry.gitlab.com/fdroid/fdroidserver:buildserver,
# which is the actual Debian 13 environment F-Droid's CI builds on -
# fdroidserver itself pip-installed on top, since the image doesn't ship
# it). `fdroid lint com.bosun.app` passes clean. `fdroid build -t`
# (local/non-server test mode) found and fixed three real bugs:
#   - init: used an invented $$bosun-midi-captain$$ placeholder for "repo
#     root" - not real F-Droid syntax (only $$SDK$$/$$NDK$$/$$VERSION$$
#     are), and since init commands run through bash -c, bash's own $$
#     (process ID) mangled every path. Rewritten with relative paths.
#   - The buildserver image's ndk/ directory ships EMPTY - added the
#     `ndk:` field so F-Droid actually provisions $$NDK$$ before init:
#     runs, instead of assuming it's already there.
#   - cargo had no linker configured for aarch64-linux-android (same
#     requirement build-android.ps1 sets locally via
#     CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER) - added the export.
#
# RESOLVED VIA REAL PIPELINE RUNS (2026-08-16, MR !43795, iterating
# against the actual F-Droid buildserver - not local test mode, which
# skips `sudo:` entirely and couldn't have caught any of these):
#   - crates.io network access during the build: WORKS. Pipeline
#     #2763743410 resolved and downloaded every one of Bosun's ~150
#     transitive crate dependencies successfully before hitting the
#     (unrelated, now-fixed) missing-C-compiler error below. No
#     vendoring needed.
#   - node/npm install, rustup install, and the npm/vite frontend build
#     all work as-is once the ndk:/PATH/HOME issues above were fixed.
#   - The documented Tauri-vs-F-Droid gradlew-stripping incompatibility
#     (tauri-apps/tauri#6367) has NOT bitten this recipe, because it never
#     calls `tauri android build` in the first place - cargo and gradlew
#     are invoked directly (see init:/gradle: below), same as
#     build-android.ps1 does locally. Confirmed by getting past the whole
#     Rust build step without hitting it.
#
# RESOLVED (2026-08-16, pipeline #2763765662, commit 10a28773): pushed the
# scandelete:/scanignore: fix above. The scanner passed clean this time -
# gradle:/assembleRelease ran for the FIRST TIME EVER in this recipe's
# history (confirmed via GitLab API job trace, not just the pipeline
# summary). It still failed, but on a new, different problem, two whole
# steps further than any previous run.
#
# RESOLVED (2026-08-16, pipeline #2763792622, commit 050e4581): pushed the
# TAURI_ANDROID_PROJECT_PATH/PACKAGE_UNESCAPED fix below. tauri.settings.
# gradle now exists, settings evaluation succeeded, and the build got all
# the way into the app module - buildSrc compiled, :app:preBuild and
# :app:preArm64ReleaseBuild ran - further than ever before. STILL failed,
# on yet another new problem (below).
#
# STILL UNVERIFIED: whether `gradle: assembleRelease` can complete an
# actual APK. Pipeline #2763765662: "FAILURE: ... Could not read script
# '.../gen/android/tauri.settings.gradle' as it does not exist." That file
# (and app/tauri.build.gradle.kts, which app/build.gradle.kts also
# `apply(from = ...)`s) are BOTH gitignored - genuinely generated files,
# not committed - and locally only exist because a real `cargo tauri
# android` CLI run created them once and they've sat on disk ever since;
# plain `cargo build` (what init: runs, and what build-android.ps1 runs
# locally too) never recreates them.
#
# Root cause, confirmed by reading the actual generator source (cached
# locally at ~/.cargo/registry/src/.../tauri-build-2.6.2/src/{lib,mobile}.rs
# for the exact versions this project pins): tauri-build's build.rs calls
# `mobile::generate_gradle_files(project_dir)` - which writes BOTH files
# from `DEP_*_ANDROID_LIBRARY_PATH` env vars that tauri/tauri-plugin-shell/
# tauri-plugin-serialplugin's own build scripts already emit automatically
# for any Android cross-compile (verified in their build.rs too - not
# gated on anything CLI-specific) - but ONLY if `env::var_os
# ("TAURI_ANDROID_PROJECT_PATH")` is set; if unset, the whole call is
# skipped and both files are silently never written. Nothing in init: (or
# build-android.ps1) ever sets it - it works locally purely because the
# files already exist from a prior full CLI/Android-Studio-gradle-plugin
# run.
#
# Setting ONLY that var is not enough, though - tauri's own build.rs
# (tauri-2.11.2/build.rs, NOT tauri-build) has a SECOND, separate block
# also gated on TAURI_ANDROID_PROJECT_PATH: it writes app/proguard-tauri.pro
# (also gitignored, also `apply`'d - same missing-generated-file problem)
# and needs a package name for it. It tries TAURI_ANDROID_PACKAGE_UNESCAPED
# first; if that's unset it falls back to WRY_ANDROID_PACKAGE via a helper
# that PANICS if the var is missing entirely - and WRY_ANDROID_PACKAGE is
# never set in this recipe (confirmed: the Kotlin-codegen block that's the
# only other consumer of it is itself gated behind WRY_ANDROID_KOTLIN_
# FILES_OUT_DIR, which is also unset here, so that whole block - and thus
# WRY_ANDROID_PACKAGE - is silently skipped today; cargo build currently
# succeeds only because nothing reaches that fallback yet). Setting
# TAURI_ANDROID_PROJECT_PATH alone would newly reach it and panic the
# cargo build - trading today's gradle-side failure for a worse Rust-side
# one. Fixed below by setting TAURI_ANDROID_PACKAGE_UNESCAPED explicitly
# (confirmed identical to tauri.conf.json's "identifier": "com.bosun.app"),
# which is checked first and skips that fallback entirely.
#
# RESOLVED (2026-08-16, pipeline #2763792622): with both
# own bug: app/build.gradle.kts's last line (`apply(from = "tauri.build.
# gradle.kts")`) has no trailing newline, so `echo ... >>` glued the new
# snippet onto the END of that same line instead of a new one - a Kotlin
# syntax error ("Unresolved reference: tasks"), not a real Gradle/Tauri
# problem. Fixed with `printf '\n...\n'` instead of `echo`, so a newline
# is guaranteed before the snippet regardless of the file's existing
# trailing newline.
#
# STILL UNVERIFIED (found 2026-08-16, pipeline #2763792622): with both
# fixes above, Gradle settings evaluation and buildSrc compilation now
# succeed - further than ever before - but the app module build fails at
# :app:rustBuildArm64Release:
#   > bosun-editor@0.6.0 tauri
#   > tauri android android-studio-script --release --target aarch64
#   thread '<unnamed>' panicked at crates/tauri-cli/src/mobile/mod.rs:386:59:
#   failed to read missing addr file /tmp/com.bosun.app-server-addr
#   Aborted (core dumped)
#   Process 'command 'npm'' finished with non-zero exit value 134
#
# rustBuildArm64Release/rustBuildArmRelease/rustBuildX86Release/
# rustBuildX86_64Release are tasks Tauri's own Gradle "rust" plugin
# (id("rust")) registers, and by default `assembleRelease` depends on
# them. Each one shells out to the real Tauri CLI's `android-studio-
# script` subcommand - meant for a live Android Studio dev session with a
# running dev server, not a release build - which panics here because no
# such server/addr file exists. build-android.ps1 already knows this and
# excludes exactly these four tasks locally via `-x rustBuildArm64Release
# -x rustBuildArmRelease -x rustBuildX86Release -x rustBuildX86_64Release`
# when invoking gradlew - init: already builds the .so via plain `cargo
# build` and copies it into jniLibs/ by hand, so these tasks are pure
# redundant (and broken) work here regardless.
#
# F-Droid's `gradle:` build flag only selects flavor-derived task names
# (`assembleRelease`, `assembleFooRelease`, ...) - there's no metadata
# field for passing extra gradlew args like `-x`. Fixed instead at the
# source level: init: appends a snippet to the checked-out app/build.
# gradle.kts (after id("rust") has already been applied, so this doesn't
# disturb whatever else that plugin wires up at configure time) that
# disables any task whose name starts with "rustBuild". AGP still
# packages the .so directly from jniLibs/ - that's a standard Android
# source set read from disk at assemble time, independent of whether
# these tasks ran.
#
# RESOLVED (2026-08-16, pipeline for commit 2a8ad842): rustBuildArm64Release
# and its three siblings now show SKIPPED, and the build sailed through
# ~150 resource/manifest/asset tasks per architecture variant - further
# than ever before. New failure: :app:compileArm64ReleaseKotlin FAILED,
# "Unresolved reference: TauriActivity" in MainActivity.kt, plus a cascade
# of unresolved Activity lifecycle methods (onCreate/onResume/onDestroy/
# etc - all methods TauriActivity would provide). Confirmed via the local
# gen/android checkout (a real past CLI run's output, still on disk though
# gitignored): TauriActivity.kt/WryActivity.kt/RustWebView.kt/Rust.kt/etc
# all live in app/src/main/java/com/bosun/app/generated/ - itself
# gitignored (app/.gitignore: `/src/main/**/generated`) - confirming these
# are ALSO genuinely generated files this recipe never produces, same
# pattern as tauri.settings.gradle/tauri.build.gradle.kts/proguard-tauri.
# pro before them. Root cause, confirmed by reading both tauri-2.11.2's
# AND wry-0.55.1's build.rs (both cached locally): each has its own
# Kotlin-codegen block, gated behind WRY_ANDROID_KOTLIN_FILES_OUT_DIR/
# WRY_ANDROID_PACKAGE/WRY_ANDROID_LIBRARY, that renders their respective
# bundled .kt templates (tauri's mobile/android-codegen/TauriActivity.kt;
# wry's src/android/kotlin/*.kt) into that out-dir - never set in this
# recipe, so both blocks were silently skipped. Fixed below by setting all
# three (WRY_ANDROID_LIBRARY confirmed against the local generated Rust.
# kt's System.loadLibrary("bosun_editor_lib") call, matching Cargo.toml's
# [lib] name) plus mkdir -p'ing the out-dir first, since both build.rs
# files canonicalize() it (which requires the path to already exist).
#
# RESOLVED (2026-08-16, pipeline for commit 9d02366f): huge milestone -
# "BUILD SUCCESSFUL in 3m 44s", a real unsigned APK produced at exactly
# the path this recipe's output: expects, for the FIRST TIME EVER across
# every pipeline run in this MR's history. The job still failed, but on
# fdroidserver's own post-build check, not the build itself: "Unexpected
# versionCode in output; APK: '1', Expected: '29'". Root cause: app/build.
# gradle.kts reads versionCode/versionName from gen/android/app/tauri.
# properties (gitignored, same missing-generated-file pattern as every
# fix above) via a Properties.getProperty(key, default) call, falling
# back to "1"/"1.0" when the file doesn't exist - exactly what happened.
# Confirmed by reading tools/bump-version.ps1's own extensive comment on
# this exact file: tauri.properties is NOT derived from tauri.conf.json
# at all (that file's own android.versionCode: 2 is unrelated/unused) -
# it's written directly, by bump-version.ps1 locally and by release.yml's
# Android CI job, both from the same TRACKED counter file (editor/
# src-tauri/android-version-code.txt, committed to the repo, currently
# "29" - matches this Build entry's versionCode: 29). Fixed below by
# replicating release.yml's exact tauri.properties write.
#
# RESOLVED (2026-08-16, pipeline for commit c4eddb09): with the `fdroid
# build` job finally down to a genuine build-vs-build content diff (see
# the assets/ and tauri.conf.json findings further below), three OTHER,
# separate CI jobs in the same pipeline failed for the first time: fdroid
# rewritemeta (this file's line-wrapping didn't match fdroidserver's own
# canonical formatter - every push so far was hand-constructed/API-
# wrapped, never run through the actual tool), tools check scripts (see
# the Summary: finding below), and checkupdates (see the UpdateCheckMode
# finding below). Fixed the formatting by pip installing fdroidserver
# locally and running `python -m fdroidserver.rewritemeta com.bosun.app`
# directly against this file - confirmed idempotent (a second run made no
# further changes) and semantically identical to the pre-rewrite content
# (parsed both with yaml.safe_load and compared equal) before adopting
# its exact line-wrapping as this file's new formatting baseline.

