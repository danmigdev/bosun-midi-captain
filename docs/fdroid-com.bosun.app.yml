      - export CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android29-clang
      - export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang
      - export TAURI_ANDROID_PROJECT_PATH="$(pwd)"
      - export TAURI_ANDROID_PACKAGE_UNESCAPED="com.bosun.app"
