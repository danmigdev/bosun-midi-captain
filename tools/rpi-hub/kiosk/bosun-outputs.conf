# All connected output-management heads participate in profile matching,
# including disabled heads. HDMI keeps the mode selected by Cage from EDID.
profile hdmi {
    output HEADLESS-1 disable
    output HDMI-A-1 enable position 0,0 scale 1 transform normal
    exec /opt/bosun-hub/kiosk/bosun-vnc-output.sh
}

# Capture the same Cage/Chromium session when the physical panel is absent.
# Headless outputs advertise no modes, so this must be an explicit custom mode.
profile no-panel {
    output HEADLESS-1 enable mode --custom 1920x440@60Hz position 0,0 scale 1 transform normal
    exec /opt/bosun-hub/kiosk/bosun-vnc-output.sh
}
