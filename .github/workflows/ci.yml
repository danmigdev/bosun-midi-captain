# Continuous integration for the editor, hub and Android app.
# Firmware builds and tests run in native.yml.
name: CI

on:
  # Branch pushes only. Tag pushes (v*) are handled by release.yml, so without
  # this filter every tagged release triggered CI twice (once for the branch
  # commit, once for the tag on the same commit).
  push:
    branches: ["**"]
  pull_request:

jobs:
  editor:
    name: Editor (svelte-check + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          # Cache npm downloads keyed off the editor lockfile.
          cache: npm
          cache-dependency-path: editor/package-lock.json

      # Install from the committed lockfile. We use `npm install` rather than
      # `npm ci` on purpose: esbuild (pulled in by both vite and vitest) ships
      # its binary as per-platform OPTIONAL deps, and npm ci is strict enough to
      # abort with EBADPLATFORM on the cross-platform ones. `npm install` honors
      # the committed lock for versions but skips incompatible optionals cleanly.
      - name: Install dependencies
        working-directory: editor
        run: npm install --no-audit --no-fund

      # svelte-check: the "check" script in editor/package.json.
      - name: Type-check (svelte-check)
        working-directory: editor
        run: npm run check

      # vitest: the "test" script in editor/package.json (vitest run).
      - name: Unit tests (vitest)
        working-directory: editor
        run: npm test

      - name: Production builds (desktop frontend + Stage kiosk)
        working-directory: editor
        run: |
          npm run build
          npm run build:stage

  rust:
    name: Desktop backend (Rust unit tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor/src-tauri
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libudev-dev pkg-config
      - name: Prepare build-script inputs
        run: |
          mkdir -p editor/dist
          printf '<!doctype html>\n' > editor/dist/index.html
      - name: Run Rust backend tests
        working-directory: editor/src-tauri
        run: cargo test --locked

  tooling:
    name: Shared packaging and release tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require PowerShell for version-bump smoke tests
        run: command -v pwsh
      - name: Verify release identities and packaging checks
        run: |
          python tools/verify_release_version_test.py
          python tools/verify_firmware_package_test.py

  hub:
    name: Raspberry Pi hub (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tools/rpi-hub/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: tools/rpi-hub
      - name: Stage deploy helper offline safety test
        shell: pwsh
        run: ./tools/rpi-hub/tests/test_deploy_stage.ps1
      - name: Hub deploy helper offline safety and health-mock test
        shell: pwsh
        run: ./tools/rpi-hub/tests/test_deploy_hub.ps1

  android-unit:
    name: Android native unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor/src-tauri
          key: android-unit
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;25.2.9519653 cmdline-tools;latest"
      - name: Initialize Tauri Android project
        working-directory: editor
        run: |
          npm install --no-audit --no-fund
          npx tauri android init --ci --skip-targets-install
      - name: Generate machine-local Tauri Android bindings
        working-directory: editor/src-tauri
        # init only creates the project skeleton. Cargo's Android build scripts
        # generate the ignored Gradle dependency paths and Wry/Tauri Kotlin
        # sources that a clean checkout needs before Gradle can configure.
        run: |
          mkdir -p ../dist
          printf '<!doctype html>\n' > ../dist/index.html
          export TAURI_ANDROID_PROJECT_PATH="$PWD/gen/android"
          export TAURI_ANDROID_PACKAGE_UNESCAPED=com.bosun.app
          export WRY_ANDROID_PACKAGE=com.bosun.app
          export WRY_ANDROID_LIBRARY=bosun_editor_lib
          export WRY_ANDROID_KOTLIN_FILES_OUT_DIR="$PWD/gen/android/app/src/main/java/com/bosun/app"
          cargo check --locked --target aarch64-linux-android --lib
          test -s gen/android/tauri.settings.gradle
          test -s gen/android/app/tauri.build.gradle.kts
      - name: Kotlin unit tests and Android lint
        working-directory: editor/src-tauri/gen/android
        # Bare testDebugUnitTest/lintDebug select the Android library modules,
        # but the app has ABI-flavoured task names.  Name its universal variant
        # explicitly so our Kotlin bridge tests and sources cannot be skipped.
        run: >-
          ./gradlew :app:testUniversalDebugUnitTest :app:lintUniversalDebug
          testDebugUnitTest lintDebug --stacktrace
