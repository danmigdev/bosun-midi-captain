# Cross-platform release builds: Windows (portable zip), macOS (dmg) and
# Linux (AppImage). Runs on each OS's native runner (Tauri links the OS-native
# webview and cannot cross-compile) and attaches the artifact to the GitHub
# release for the tag.
#
# Triggers on a v* tag push, or manually via workflow_dispatch with a tag input
# (build/attach an existing release without moving its tag). The bundled
# legacy firmware/UF2/Adafruit assets are gitignored, so installer and recovery
# bundles still provision the frozen resources. Only native firmware advances
# with the release; CircuitPython is no longer compiled or maintained here.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach (e.g. v0.4.0)"
        required: true
      platform:
        description: "Platform to rebuild for the existing tag"
        type: choice
        default: all
        options: [all, windows, macos, linux, android]

permissions:
  contents: write

jobs:
  verify:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      firmware_version: ${{ steps.version.outputs.firmware_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require matching tag, editor and firmware versions
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python tools/verify_release_version_test.py
          python tools/verify-release-version.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libudev-dev pkg-config
      - name: Install dependencies
        run: |
          (cd editor && npm install --no-audit --no-fund)
          python -m pip install -r tools/rpi-hub/requirements.txt pytest
      - name: Test and build every portable layer
        run: |
          cd editor
          npm run check
          npm test
          npm run build
          npm run build:stage
          cd ..
          cd tools/rpi-hub
          python -m pytest -q
          cd ../..
          mkdir -p editor/src-tauri/resources/lib
          : > editor/src-tauri/resources/circuitpython.uf2
          python tools/sync_firmware_resources.py --repo-root .
          cargo test --locked --manifest-path editor/src-tauri/Cargo.toml

  native-package:
    name: Verified native update package
    needs: verify
    if: github.event.inputs.platform != 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install native host and ARM build tools
        run: >-
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          gcc g++ python3
      - name: Build and test native core with pinned SDK and TinyUSB
        run: bash tools/native-build.sh all --fetch-sdk
      - name: Create and verify this release's native package
        env:
          BOSUN_RELEASE: ${{ needs.verify.outputs.release }}
          BOSUN_FIRMWARE_VERSION: ${{ needs.verify.outputs.firmware_version }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python tools/package-native-update.py \
            --uf2 firmware-native/build-rp2040/bosun_native.uf2 \
            --output editor/src-tauri/resources/update/bosun-update.zip \
            --release "$BOSUN_RELEASE" --firmware-version "$BOSUN_FIRMWARE_VERSION"
          python tools/verify-release-version.py --tag "$RELEASE_TAG" \
            --package editor/src-tauri/resources/update/bosun-update.zip
          bash tools/build-factory-installer.sh
          python tools/test_factory_installer.py
      - name: Share the required native package with desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: bosun-native-update
          path: |
            editor/src-tauri/resources/update/bosun-update.zip
            editor/src-tauri/resources/installer/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: [verify, native-package]
    if: github.event.inputs.platform != 'android'
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple Silicon; the DMG is aarch64-only.
        include: ${{ fromJSON('{"all":[{"os":"windows-latest","name":"windows"},{"os":"macos-15","name":"macos"},{"os":"ubuntu-22.04","name":"linux"}],"windows":[{"os":"windows-latest","name":"windows"}],"macos":[{"os":"macos-15","name":"macos"}],"linux":[{"os":"ubuntu-22.04","name":"linux"}],"android":[]}')[github.event.inputs.platform || 'all'] }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Tauri v2 Linux build deps, plus AppImage (linuxdeploy needs FUSE),
      # ALSA (alsa-sys, pulled in by the midir MIDI crate) and udev (serialport).
      - name: Linux build deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 \
            libasound2-dev libudev-dev pkg-config

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor/src-tauri

      # The bundle assets (firmware tree, CircuitPython UF2, Adafruit libs) are
      # gitignored, so recreate them here. The same sync helper used by local
      # builds derives both firmware trees after the downloaded assets exist.
      # Single bash step for all three OSes (every runner provides bash).
      - name: Provision bundled resources
        shell: bash
        run: |
          set -euo pipefail
          RES=editor/src-tauri/resources
          rm -rf "$RES/firmware" "$RES/lib"; mkdir -p "$RES/lib"
          # 1. CircuitPython UF2 (matches tools/download-assets.ps1 default)
          curl -fL -o "$RES/circuitpython.uf2" \
            "https://downloads.circuitpython.org/bin/raspberry_pi_pico/en_US/adafruit-circuitpython-raspberry_pi_pico-en_US-9.2.7.uf2"
          # 2. Official Adafruit 9.x bundle pinned by tag + archive/file hashes.
          python tools/provision_adafruit_bundle.py --destination "$RES/lib"
          # 3. Canonical Bosun firmware -> verified/cache-free resources.
          python tools/sync_firmware_resources.py --repo-root .
          # Cargo does not fingerprint arbitrary resource contents reliably.
          touch editor/src-tauri/build.rs
          echo "resources:"; ls -la "$RES"; echo "lib:"; ls -la "$RES/lib"

      - name: Install node deps
        working-directory: editor
        run: npm install --no-audit --no-fund

      - name: Download the required native update package
        uses: actions/download-artifact@v4
        with:
          name: bosun-native-update
          path: editor/src-tauri/resources

      - name: Prepare the Raspberry Pi package and standalone setup guide
        shell: bash
        run: |
          npm --prefix editor run build:stage
          npm --prefix editor run build:guide
          python tools/package-pi-setup.py
          python tools/package-factory-installer.py --verify \
            --package editor/src-tauri/resources/update/bosun-update.zip \
            --output editor/src-tauri/resources/installer

      - name: Verify the native package before building Tauri
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python tools/verify-release-version.py --tag "$RELEASE_TAG" \
            --package editor/src-tauri/resources/update/bosun-update.zip
          touch editor/src-tauri/build.rs

      - name: Compute release display name
        id: ver
        shell: bash
        run: |
          v="${{ github.event.inputs.tag || github.ref_name }}"
          echo "label=${v#v}" >> "$GITHUB_OUTPUT"

      # Windows keeps the project's portable (no-installer) format.
      - name: Build - Windows portable zip
        if: matrix.name == 'windows'
        shell: pwsh
        working-directory: editor
        # npm's script launches Windows PowerShell 5 through cmd.exe, which
        # inherits incompatible PowerShell 7 module paths from the runner.
        run: ../tools/package-portable.ps1

      - name: Build - macOS dmg
        if: matrix.name == 'macos'
        working-directory: editor
        run: npx tauri build --bundles dmg

      - name: Build - Linux AppImage
        if: matrix.name == 'linux'
        working-directory: editor
        run: npx tauri build --bundles appimage

      - name: Locate artifact
        id: art
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            windows) f=$(ls dist/Bosun-*-portable-x64.zip | head -1) ;;
            macos)   f=$(ls editor/src-tauri/target/release/bundle/dmg/*.dmg | head -1) ;;
            linux)   f=$(ls editor/src-tauri/target/release/bundle/appimage/*.AppImage | head -1) ;;
          esac
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "artifact -> $f"

      - name: Collect the guide, Pi package, Stage and native firmware
        if: matrix.name == 'windows'
        run: python tools/package-release-extras.py

      - name: Upload shared release downloads
        if: matrix.name == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          name: Bosun ${{ steps.ver.outputs.label }}
          files: dist/release-extras/*
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'push' }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: Bosun ${{ steps.ver.outputs.label }}
          files: ${{ steps.art.outputs.file }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'push' }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: verify
    if: github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    env:
      # Reproducible-builds match for the F-Droid submission (docs/fdroid-
      # com.bosun.app.yml): rustc embeds the builder's home directory
      # verbatim in every third-party crate's panic-location strings.
      # ubuntu-latest runs as $HOME=/home/runner; F-Droid's buildserver
      # runs as /home/vagrant - different string lengths meant the
      # compiled .so files never matched byte-for-byte even with
      # identical source, toolchain, and NDK. Remapping both sides to the
      # same placeholder (F-Droid's recipe sets the identical RUSTFLAGS,
      # remapping ITS OWN $HOME instead) makes them line up. Confirmed
      # 2026-08-16: before this, per-arch .so size deltas were already
      # down to 32-1488 bytes (from ~600-800KB before also matching NDK/
      # API level) - consistent with this being the last remaining cause,
      # not a guess.
      RUSTFLAGS: --remap-path-prefix=/home/runner=/build
      CC: gcc-13
      CXX: g++-13
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc-13
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The generated app compiles/targets API 36. Keep build-tools 34 as
          # well because sign-android-release is explicitly pinned to it.
          packages: "platforms;android-36 build-tools;35.0.0 build-tools;34.0.0 ndk;29.0.14206865 cmdline-tools;latest"

      - name: Select the Android toolchain verified with F-Droid
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          ndk="$ANDROID_HOME/ndk/29.0.14206865"
          test -d "$ndk"
          printf 'NDK_HOME=%s\nANDROID_NDK_HOME=%s\nANDROID_NDK_ROOT=%s\n' "$ndk" "$ndk" "$ndk" >> "$GITHUB_ENV"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor/src-tauri

      - name: Install node deps
        working-directory: editor
        run: npm install --no-audit --no-fund

      - name: Compute release display name
        id: ver
        shell: bash
        run: |
          v="${{ github.event.inputs.tag || github.ref_name }}"
          echo "label=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Provision bundled firmware resources
        shell: bash
        run: |
          set -euo pipefail
          RES=editor/src-tauri/resources
          rm -rf "$RES/firmware" "$RES/lib"
          mkdir -p "$RES/lib"
          curl -fL -o "$RES/circuitpython.uf2" \
            "https://downloads.circuitpython.org/bin/raspberry_pi_pico/en_US/adafruit-circuitpython-raspberry_pi_pico-en_US-9.2.7.uf2"
          python tools/provision_adafruit_bundle.py --destination "$RES/lib"
          python tools/sync_firmware_resources.py --repo-root .
          touch editor/src-tauri/build.rs

      - name: Set Android versionCode in tauri.conf.json
        # gen/android/app/tauri.properties gets fully regenerated by the
        # real Tauri CLI from tauri.conf.json's own bundle.android.
        # versionCode field EVERY time `tauri android init`/`build` runs -
        # not just once. A prior fix patched tauri.properties directly,
        # timed right before the release build, and still lost: 2026-08-16,
        # re-running this exact workflow for v0.6.0 confirmed via
        # decoding the freshly-uploaded bosun.apk's AndroidManifest.xml
        # (androguard) that it STILL shipped versionCode=2 - the CLI's own
        # regeneration, which happens again inside `Build Android APK
        # (release, unsigned)` itself, overwrites any earlier downstream
        # patch regardless of timing. tauri.conf.json is the one place the
        # CLI actually reads the value FROM, so it's the only patch that
        # survives no matter how many times regeneration happens. This
        # edits the CI runner's checked-out copy only - never committed.
        # tools/bump-version.ps1's counter (android-version-code.txt,
        # tracked in git) is the source of truth CI and every dev machine
        # share - matches what local builds already use via their own
        # gitignored tauri.properties.
        shell: bash
        run: |
          set -euo pipefail
          code=$(cat editor/src-tauri/android-version-code.txt)
          conf=editor/src-tauri/tauri.conf.json
          jq --argjson code "$code" '.bundle.android.versionCode = $code' "$conf" > "$conf.tmp"
          mv "$conf.tmp" "$conf"
          echo "Set bundle.android.versionCode=$code in tauri.conf.json"
          jq '.bundle.android' "$conf"

      - name: Init Android project
        working-directory: editor
        run: npx tauri android init

      - name: Build Android APK (release, unsigned)
        working-directory: editor
        run: npx tauri android build --apk --ci -- --locked

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: editor/src-tauri/gen/android/app/build/outputs/apk/universal/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        env:
          # r0adkll/sign-android-release@v1 defaults to build-tools 29.0.3
          # for zipalign, which isn't what "Setup Android SDK" above
          # actually installs - every release through v0.6.0 silently
          # published an UNSIGNED bosun.apk as a result ("Couldn't find
          # the Android build tools @ .../build-tools/29.0.3", masked by
          # this step's own continue-on-error, so the workflow still
          # reported success). This is an env var, not a step input -
          # a first attempt at `with: buildToolsVersion:` was rejected as
          # an unexpected input (2026-08-16 CI run). Match the version
          # actually installed above.
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare APK for release
        shell: bash
        env:
          SIGNED_APK: ${{ steps.sign_apk.outputs.signedReleaseFile }}
        run: |
          set -euo pipefail
          mkdir -p release
          test -n "$SIGNED_APK"
          test -f "$SIGNED_APK"
          cp "$SIGNED_APK" release/bosun.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs release/bosun.apk
          python tools/verify_firmware_package.py \
            --resources editor/src-tauri/resources \
            --archive release/bosun.apk --prefix assets
          echo "APK ready: $(ls -lh release/bosun.apk)"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          name: Bosun ${{ steps.ver.outputs.label }}
          files: release/bosun.apk
          # Missing the `github.event.inputs.tag ||` fallback that the
          # other three platform jobs have (see tag_name a few hundred
          # lines up) meant every workflow_dispatch re-run (e.g. to pick
          # up a signing fix for an existing tag) silently uploaded to
          # whatever branch it dispatched from (github.ref_name, "main")
          # instead of the actual release - three re-runs in a row never
          # touched v0.6.0's real bosun.apk asset, which stayed broken/
          # unsigned throughout (found 2026-08-16 while chasing that bug).
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'push' }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Verify all downloads and publish
    needs: [verify, native-package, build, android]
    if: github.event_name == 'push' || github.event.inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download, verify completeness and publish with checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --dir release-assets
          python tools/release-checksums.py --tag "$RELEASE_TAG" --directory release-assets
          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS.txt --clobber
          notes="docs/releases/${RELEASE_TAG#v}.md"
          test -s "$notes"
          gh release edit "$RELEASE_TAG" --title "Bosun ${RELEASE_TAG#v}" \
            --notes-file "$notes" --draft=false \
            --prerelease=${{ needs.verify.outputs.prerelease }} \
            --latest=${{ needs.verify.outputs.prerelease != 'true' }}
